<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial reference · visual QA</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e8ebff; background: #040920; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 49% 51%, #172350 0%, #0b1438 37%, #040920 75%); }
      main { width: min(1000px, calc(100vw - 48px)); }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin-bottom: 18px; }
      h1 { margin: 0; font-size: 16px; font-weight: 550; letter-spacing: 0.015em; }
      header p, .metadata { margin: 0; font-size: 11px; color: #8d99bf; }
      .stage { position: relative; width: 100%; height: 560px; isolation: isolate; }
      #viewport, #labels { position: absolute; inset: 0; }
      #viewport canvas { display: block; width: 100%; height: 100%; outline: none; }
      #labels { pointer-events: none; overflow: hidden; }
      #labels button { position: absolute; transform: translate(-50%, -50%); padding: 8px 13px; border: 1px solid #3e4f8a; border-radius: 7px; background: linear-gradient(145deg, #293967, #1a2853); box-shadow: 0 5px 12px #02071c45; color: #f3f5ff; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.1; white-space: nowrap; pointer-events: auto; cursor: pointer; }
      #labels button.selected { outline: 1px solid #a2b4ef; outline-offset: 3px; }
      #labels button[data-active="true"] { background: linear-gradient(145deg, #ffe839, #ffd70b); border-color: #f9d712; box-shadow: 0 3px 14px #e7ba142e; color: #171a22; }
      #labels button[data-support="true"] { display: none; }
      fieldset { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 18px 0 14px; padding: 0; border: 0; }
      .toolbar button, select { border: 1px solid #303d69; border-radius: 6px; background: #141f44; padding: 7px 10px; color: #e0e7ff; font: inherit; font-size: 11px; }
      .toolbar button { cursor: pointer; }
      .toolbar button[aria-pressed="true"] { border-color: #7286ca; background: #273763; }
      .toolbar label { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: #b2bedf; }
      .toolbar .room-control { margin-left: auto; }
      input[type="checkbox"] { accent-color: #ffdd1c; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #ffdc21; outline-offset: 3px; }
      footer { display: flex; justify-content: space-between; gap: 18px; min-height: 30px; }
      #status { font-size: 11px; color: #a6b5dc; }
      #status[data-error="true"] { color: #ff9fa7; }
      @media (max-width: 760px) { .stage { height: min(560px, 64vh); } header { align-items: start; flex-direction: column; gap: 6px; } .toolbar .room-control { margin-left: 0; } footer { flex-direction: column; gap: 6px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Operační blok · referenční scéna</h1>
        <p>Vývojová vizuální kontrola · pouze ukázková data</p>
      </header>
      <section class="stage" aria-label="Šest operačních sálů pro vizuální kontrolu">
        <div id="viewport"></div>
        <div id="labels" aria-label="Výběr sálu"></div>
      </section>
      <fieldset id="controls" class="toolbar" aria-label="Ovládání vizuální kontroly" disabled>
        <button id="view-3d" type="button" aria-pressed="true">3D</button>
        <button id="view-plan" type="button" aria-pressed="false">Půdorys</button>
        <button id="reset" type="button">Reset</button>
        <label class="room-control">Sál <select id="room" aria-label="Vybraný sál"></select></label>
        <label>Stav <select id="room-status" aria-label="Vizuální stav sálu">
          <option value="ready">Připraven · neutrální</option>
          <option value="procedure">Výkon · modrý</option>
          <option value="cleaning">Úklid · fialový</option>
          <option value="unavailable">Mimo provoz · červený</option>
        </select></label>
        <label><input id="active" type="checkbox" checked /> Aktivní osvětlení</label>
      </fieldset>
      <footer>
        <p class="metadata">6 sálů · 7,03 × 6,825 m · chodba 2,8 m · otáčení a přiblížení myší</p>
        <output id="status" role="status" aria-live="polite">Načítání modelů…</output>
      </footer>
    </main>
    <script type="module" src="./spatial-reference.js"></script>
  </body>
</html>
